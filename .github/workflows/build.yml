# Сборка приложения — общая для всех приложений Winter: winter-hub/.github/workflows/flutter-app.yml
# (отдельный APK под каждый процессор, подпись, релиз, Windows-установщик). Сервер и Linux — здесь.
name: Build Winter Chat

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'integration_test/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Выпустить релиз (выключи, чтобы только проверить сборку)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Build server (Linux + Windows)
        working-directory: server
        run: |
          set -o pipefail
          go version
          go mod tidy > ../go.txt 2>&1 || { cat ../go.txt; python3 ../.winter/ci/annotate.py ../go.txt go; exit 1; }
          VER=1.0.${{ github.run_number }}
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=$VER" -o out/linux/winter-chat-server . > ../go.txt 2>&1 || { cat ../go.txt; python3 ../.winter/ci/annotate.py ../go.txt go; exit 1; }
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=$VER" -o out/windows/winter-chat-server.exe . > ../go.txt 2>&1 || { cat ../go.txt; python3 ../.winter/ci/annotate.py ../go.txt go; exit 1; }
          go vet . || true
          ls -la out/*
      - name: Download LiveKit server
        run: |
          names=$(gh release view -R livekit/livekit --json assets -q '.assets[].name')
          echo "$names"
          lin=$(echo "$names" | grep -E 'linux_amd64\.tar\.gz$' | head -1)
          win=$(echo "$names" | grep -E 'windows_amd64\.zip$' | head -1)
          echo "linux: $lin  windows: $win"
          [ -n "$lin" ] || { echo "::error title=livekit::нет сборки LiveKit для Linux: $names"; exit 1; }
          mkdir -p lk/linux lk/windows
          gh release download -R livekit/livekit -p "$lin" -D lk
          tar -xzf "lk/$lin" -C lk/linux
          cp "$(find lk/linux -type f -name 'livekit-server' | head -1)" server/out/linux/livekit-server
          chmod +x server/out/linux/*
          if [ -n "$win" ]; then
            gh release download -R livekit/livekit -p "$win" -D lk
            unzip -q "lk/$win" -d lk/windows
            cp "$(find lk/windows -type f -iname 'livekit-server.exe' | head -1)" server/out/windows/livekit-server.exe
          else
            echo "::warning title=livekit::нет сборки LiveKit для Windows — собираю из исходников"
            tag=$(gh release view -R livekit/livekit --json tagName -q .tagName)
            git clone -q --depth 1 -b "$tag" https://github.com/livekit/livekit lk/src
            (cd lk/src && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../server/out/windows/livekit-server.exe ./cmd/server)
          fi
          lic=$(find lk -maxdepth 3 -iname 'LICENSE*' | head -1)
          [ -n "$lic" ] && cp "$lic" server/out/linux/LiveKit-LICENSE.txt && cp "$lic" server/out/windows/LiveKit-LICENSE.txt || true
          ls -la server/out/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test (регистрация, чаты, файлы, звонки)
        run: |
          set +e
          command -v jq >/dev/null || sudo apt-get install -y -q jq
          bash server/smoke_test.sh "$PWD/server/out/linux" > smoke.txt 2>&1
          code=$?
          cat smoke.txt
          if [ $code -ne 0 ]; then
            {
              echo "exit=$code"
              grep -v '^::' smoke.txt | tail -60
              echo '--- server.log'
              tail -40 server/out/linux/server.log
              echo '--- livekit.log'
              tail -30 server/out/linux/winter-chat-data/livekit.log
              echo '--- livekit.yaml'
              cat server/out/linux/winter-chat-data/livekit.yaml
            } > smoke_fail.txt 2>&1
            python3 .winter/ci/annotate.py smoke_fail.txt go
            exit 1
          fi
      - name: Package
        run: |
          rm -rf server/out/linux/winter-chat-data server/out/linux/server.log
          mkdir -p dist "pkg/Winter Chat Server" pkg/winter-chat-server
          cp server/out/windows/* "pkg/Winter Chat Server/"
          cp server/package/windows/* "pkg/Winter Chat Server/"
          (cd pkg && zip -qr ../dist/Winter-Chat-Server-Windows.zip "Winter Chat Server")
          cp server/out/linux/* pkg/winter-chat-server/
          cp server/package/linux/* pkg/winter-chat-server/
          chmod +x pkg/winter-chat-server/*.sh pkg/winter-chat-server/winter-chat-server pkg/winter-chat-server/livekit-server
          tar -czf dist/Winter-Chat-Server-Linux.tar.gz -C pkg winter-chat-server
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*
      - name: Files for the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-files
          path: server/out/windows/

  app:
    needs: server
    uses: Wateroflord/winter-hub/.github/workflows/flutter-app.yml@main
    secrets: inherit
    with:
      project: winter_chat
      org: com.winterhub
      asset: Winter-Chat
      title: Winter Chat
      extra_artifact: server
      notes: |
        Linux: Winter-Chat-Linux.tar.gz (появится через несколько минут).

        **Сервер для ноутбука:** `Winter-Chat-Server-Setup.exe` — установил, и сервер готов (появится через несколько минут; проще ставить через Winter Hub на ПК).
        Без установки: Winter-Chat-Server-Windows.zip или Winter-Chat-Server-Linux.tar.gz — распакуй и запусти, внутри есть инструкция.
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

  linux:
    needs: app
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - name: Linux build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libstdc++-12-dev libpulse-dev libasound2-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Create Linux project
        run: |
          flutter create --project-name winter_chat --org com.winterhub --platforms linux .
          rm -f test/widget_test.dart
          python3 tools/patch_linux.py
          flutter pub get
      - name: Build Linux app
        run: |
          set -o pipefail
          flutter build linux --release --dart-define=BUILD=${{ github.run_number }} --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.txt || { python3 .winter/ci/annotate.py build.txt "linux"; exit 1; }
      - name: Package and attach
        run: |
          mkdir -p pkg/winter-chat
          cp -r build/linux/x64/release/bundle pkg/winter-chat/bundle
          cp tools/linux/install.sh pkg/winter-chat/
          chmod +x pkg/winter-chat/install.sh pkg/winter-chat/bundle/winter_chat
          tar -czf Winter-Chat-Linux.tar.gz -C pkg winter-chat
          gh release upload "build-${{ github.run_number }}" Winter-Chat-Linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Установщик сервера для Windows: запустил Setup.exe — сервер готов (брандмауэр, автозапуск, без окна).
  server-installer:
    needs: [server, app]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-windows-files
          path: pkg
      - name: Build installer
        shell: pwsh
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          Get-ChildItem pkg
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc tools\server\server-installer.iss
          if ($LASTEXITCODE -ne 0) { echo "::error title=installer::Inno Setup failed"; exit 1 }
          Get-ChildItem dist
      - name: Check installer on Windows (install, start, second start, stop, uninstall)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail($m) { echo "::error title=server installer::$m"; $log = "$env:LOCALAPPDATA\Programs\Winter Chat Server\winter-chat-data\server.log"; if (Test-Path $log) { Get-Content $log -Tail 40 }; exit 1 }
          function Up { try { (Invoke-RestMethod -TimeoutSec 3 http://127.0.0.1:8090/api/wc/info).app -eq 'winter-chat' } catch { $false } }
          function WaitUp($want, $sec) { for ($i = 0; $i -lt $sec; $i++) { if ((Up) -eq $want) { return $true }; Start-Sleep 1 }; return $false }
          # Ждём только сам процесс (Start-Process с ожиданием ждал бы ещё и запущенный им сервер).
          function Run($file, $argv) { $p = Start-Process $file -ArgumentList $argv -PassThru; $null = $p.Handle; $p.WaitForExit(); return $p.ExitCode }
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')

          $code = Run 'dist\Winter-Chat-Server-Setup.exe' $silent
          if ($code -ne 0) { Fail "установщик завершился с кодом $code" }
          $app = "$env:LOCALAPPDATA\Programs\Winter Chat Server"
          $exe = "$app\winter-chat-server.exe"
          foreach ($f in @($exe, "$app\livekit-server.exe", "$app\server-setup.cmd", "$app\server.ico")) { if (-not (Test-Path $f)) { Fail "нет файла $f" } }
          $ver = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{326EC2C1-328E-40A2-AC0C-32F128771DD2}_is1').DisplayVersion
          if ($ver -ne "1.0.${{ github.run_number }}") { Fail "в реестре версия '$ver' (хаб по ней видит установку)" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Startup'))\Winter Chat Server.lnk")) { Fail "нет автозапуска" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Winter Chat Server.lnk")) { Fail "нет значка на рабочем столе" }
          echo "Файлы, реестр и ярлыки на месте (версия $ver)"

          if (-not (WaitUp $true 90)) { Fail "после тихой установки сервер не запустился" }
          echo "Сервер запустился сам после установки"
          netsh advfirewall firewall show rule name="Winter Chat Server" | Out-Host
          if ($LASTEXITCODE -ne 0) { echo "::warning title=server installer::правило брандмауэра не создано (на сборочном сервере UAC может быть устроен иначе)" } else { echo "Брандмауэр настроен" }

          $code = Run $exe @('--background', '--no-browser')
          if ($code -ne 0) { Fail "второй запуск завершился с кодом $code" }
          if (-not (Up)) { Fail "второй запуск сломал работающий сервер" }
          echo "Второй запуск не мешает работающему серверу"

          $code = Run $exe @('--stop')
          if ($code -ne 0) { Fail "--stop завершился с кодом $code" }
          if (-not (WaitUp $false 15)) { Fail "сервер не выключился по --stop" }
          Start-Sleep 2
          if (Get-Process livekit-server -ErrorAction SilentlyContinue) { Fail "после выключения остался livekit-server" }
          echo "Выключение работает"

          # Обновление поверх (как из хаба): сервер снова должен подняться, данные остаться.
          Start-Process $exe -ArgumentList '--background','--no-browser'
          if (-not (WaitUp $true 60)) { Fail "сервер не запустился ярлыком" }
          $invite = (Get-Content "$app\winter-chat-data\server.json" | ConvertFrom-Json).inviteCode
          $code = Run 'dist\Winter-Chat-Server-Setup.exe' $silent
          if ($code -ne 0) { Fail "обновление завершилось с кодом $code" }
          if (-not (WaitUp $true 90)) { Fail "после обновления сервер не запустился" }
          $invite2 = (Get-Content "$app\winter-chat-data\server.json" | ConvertFrom-Json).inviteCode
          if ($invite -ne $invite2) { Fail "после обновления сменились данные сервера" }
          echo "Обновление поверх работает, данные на месте"

          $un = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{326EC2C1-328E-40A2-AC0C-32F128771DD2}_is1').UninstallString.Trim('"')
          $null = Run $un $silent
          # Деинсталлятор Inno перезапускает себя из временной папки — ждём, пока программа исчезнет.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          if (Up) { Fail "после удаления сервер всё ещё работает" }
          if (Test-Path $exe) { Fail "после удаления осталась программа" }
          if (-not (Test-Path "$app\winter-chat-data\server.json")) { Fail "удаление стёрло данные сервера" }
          if (Test-Path "$([Environment]::GetFolderPath('Startup'))\Winter Chat Server.lnk") { Fail "после удаления остался автозапуск" }
          echo "Удаление работает, данные остались"
      - name: Attach to the release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "build-${{ github.run_number }}" dist/Winter-Chat-Server-Setup.exe --clobber
      - name: Files (test build, no release)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: server-installer
          path: dist/Winter-Chat-Server-Setup.exe
