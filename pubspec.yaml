name: winter_chat
description: Winter Chat — мессенджер для друзей со звонками и демонстрацией экрана.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  winter_core:
    git:
      url: https://github.com/Wateroflord/winter-hub.git
      path: packages/winter_core
  pocketbase: ^0.25.0
  http: ^1.2.2
  livekit_client: ^2.13.0
  flutter_webrtc: any
  flutter_background: ^1.3.0
  file_picker: ^10.3.0
  shared_preferences: ^2.3.0
  android_alarm_manager_plus: '>=4.0.0 <6.0.0'
  flutter_local_notifications: ^19.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  logging: any
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A1020"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
